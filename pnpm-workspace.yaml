packages:
  - apps/*
  - packages/*

catalogMode: prefer

allowBuilds:
  '@google/genai': false
  node-llama-cpp: false
  protobufjs: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false

catalog:
  '@byc/vp-config': 0.2.0
  '@earendil-works/pi-ai': 1.6.0
  '@shadcn/react': ^0.3.1
  '@stylistic/eslint-plugin': ^6.0.1
  '@types/node': ^24
  '@types/ws': ^8.18.2
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.2
  cookie: ^2.0.2
  drizzle-kit: 1.0.0-beta.22
  drizzle-orm: 1.0.0-beta.22
  markstream-react: ^2.0.32
  react-resizable-panels: ^4.24.1
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  ws: ^8.23.0
overrides:
